{% load i18n %}
{% if highlights %}
<section class="mb-12" aria-label="{% trans 'Highlights' %}">
  <div style="display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;
              padding-bottom:.5rem;-webkit-overflow-scrolling:touch">
    {% for h in highlights %}
    <article style="flex:0 0 min(420px,85%);scroll-snap-align:start;border:1px solid var(--rule,#e5e2da);
                    border-radius:14px;overflow:hidden;background:var(--paper-2,#faf9f6)">
      {% if h.image %}<img src="{{ h.image }}" alt="" loading="lazy"
           style="width:100%;height:160px;object-fit:cover;display:block">{% endif %}
      <div style="padding:1rem 1.15rem 1.15rem">
        <h3 class="display" style="font-size:1.15rem;font-weight:700;margin:0 0 .35rem;line-height:1.25">
          {% if h.url %}<a href="{{ h.url }}" style="color:inherit">{{ h.title }}</a>{% else %}{{ h.title }}{% endif %}
        </h3>
        {% if h.blurb %}<p style="font-size:.9rem;color:var(--ink-soft,#666);margin:0 0 .6rem">{{ h.blurb }}</p>{% endif %}
        {% if h.url %}<a href="{{ h.url }}" style="font-size:.85rem;font-weight:600;color:var(--accent,#b3542e)">
          {{ h.cta|default:_("Read more") }} →</a>{% endif %}
      </div>
    </article>
    {% endfor %}
  </div>
</section>
{% endif %}
