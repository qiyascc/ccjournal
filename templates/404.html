<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Page not found</title>
<link href="/static/fonts/fonts.css" rel="stylesheet">
<style>
:root{--paper:#fcfcfa;--ink:#0a0a0a;--soft:#5f5f5a;--line:#e6e6e3;--accent:#1f3df2}
@media(prefers-color-scheme:dark){:root{--paper:#0c0c0d;--ink:#f4f4f2;--soft:#a3a39e;--line:#26262a;--accent:#6d83ff}}
*{box-sizing:border-box;margin:0}body{min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:24px}
.card{max-width:520px;text-align:center}
.code{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:800;font-size:clamp(5rem,18vw,9rem);line-height:1;letter-spacing:-.04em}
.code span{color:var(--accent)}
h1{font-family:'Bricolage Grotesque',Inter,sans-serif;font-weight:700;font-size:1.5rem;margin:10px 0 8px}
p{color:var(--soft);font-size:.95rem;line-height:1.6}
a.btn{display:inline-flex;margin-top:24px;padding:.65rem 1.4rem;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:.9rem}
.rule{height:1px;background:var(--line);margin:26px auto;width:64px}
</style></head><body>
<div class="card">
  <div class="code">4<span>0</span>4</div>
  <h1>Page not found</h1>
  <p>The page you are looking for doesn’t exist or may have moved.</p>
  <div class="rule"></div>
  <a class="btn" href="/">Go to homepage</a>
</div>
</body></html>
