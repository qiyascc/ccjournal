{% load i18n %}<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#0a0a0a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border:1px solid #e6e6e3;border-radius:14px;overflow:hidden;">
        <tr><td style="background:#0a0a0a;padding:20px 28px;">
          <span style="font-size:18px;font-weight:700;letter-spacing:-0.02em;color:#ffffff;">{{ journal_title|default:"Journal" }}</span>
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#1f3df2;margin-left:6px;"></span>
        </td></tr>
        <tr><td style="padding:32px 28px;">
          {% if subject %}<h1 style="margin:0 0 18px;font-size:20px;font-weight:700;letter-spacing:-0.01em;color:#0a0a0a;">{{ subject }}</h1>{% endif %}
          <div style="font-size:15px;line-height:1.65;color:#27272a;">
            {{ body_html|safe }}
          </div>
        </td></tr>
        <tr><td style="padding:18px 28px;border-top:1px solid #e6e6e3;font-size:12px;color:#8a8a8a;">
          {{ journal_title|default:"Journal" }}{% if site_url %} · <a href="{{ site_url }}" style="color:#1f3df2;text-decoration:none;">{{ site_url }}</a>{% endif %}
        </td></tr>
      </table>
    </td></tr>
  </table>
</body></html>
